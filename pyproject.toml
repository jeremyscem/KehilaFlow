[project]
name = "kehilaflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scemama Jeremy", email = "scemama.jeremy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
kehilaflow = "kehilaflow.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
