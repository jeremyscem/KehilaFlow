[project]
name = "kehilaflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scemama Jeremy", email = "scemama.jeremy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
kehilaflow = "kehilaflow.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
